<body><main id="agent" aria-label="AI agent sample preview"></main><script>
// Every agent shares this shell; change its definition and adapter, not its UI.
function defineAgent(overrides = {}) {
  const agent = {
    id: 'chatgpt-template',
    title: 'AI agent template',
    provider: 'ChatGPT',
    modelSelection: true,
    preview: false,
    ...overrides,
    prompt: {
      label: 'Prompt template',
      value: 'Use the test input to complete the requested task.\nBe clear, accurate, and concise.\nUse only the information provided.',
      editable: true,
      visible: true,
      required: true,
      ...overrides.prompt,
    },
    input: {
      label: 'Test input',
      value: '',
      placeholder: 'Paste the information you want to test…',
      editable: true,
      visible: true,
      required: true,
      ...overrides.input,
    },
    result: {
      label: 'Result',
      placeholder: 'Your result will appear here.',
      ...overrides.result,
    },
  };
  if (!agent.id || !agent.title) throw new TypeError('An agent needs an id and title.');
  for (const key of ['prompt', 'input']) {
    if (typeof agent[key].value !== 'string') throw new TypeError(`${key}.value must be a string.`);
    if (!agent[key].visible && agent[key].editable) {
      throw new TypeError(`Hidden ${key} must be fixed (editable: false).`);
    }
  }
  return agent;
}

function formatResult(result) {
  if (typeof result === 'string') return result;
  if (result && typeof result.text === 'string') return result.text;
  if (result && Object.hasOwn(result, 'data')) {
    const serialized = JSON.stringify(result.data, null, 2);
    if (typeof serialized === 'string') return serialized;
  }
  throw new TypeError('The agent must return a string, { text }, or { data }.');
}


function isSessionExpired(error) {
  return error?.status === 401 || ['SESSION_EXPIRED', 'session_expired', 'agent_authentication_required',
    'provider_authorization_expired', 'authentication_error'].includes(error?.code);
}
function verifiedSession(value, now) {
  if (!value || value.authenticated !== true) return null;
  if (typeof value.user?.id !== 'string' || !value.user.id.trim()) throw new TypeError('The verified session needs a stable account id.');
  if (typeof value.user.name !== 'string' || !value.user.name.trim()) throw new TypeError('The verified session needs an account label.');
  if (value.expiresAt != null) {
    const expiry = typeof value.expiresAt === 'number' ? value.expiresAt : Date.parse(value.expiresAt);
    if (!Number.isFinite(expiry) || expiry <= now) return null;
  }
  return value;
}
function normalizeModels(values) {
  if (!Array.isArray(values)) throw new TypeError('Model list is unavailable.');
  const ids = new Set();
  return values.map(model => {
    if (typeof model?.id !== 'string' || !model.id.trim() || ids.has(model.id)) throw new TypeError('Models must have unique string ids.');
    ids.add(model.id);
    if (!Array.isArray(model.thinkingEfforts ?? [])) throw new TypeError('Thinking efforts must be an array.');
    const efforts = [...new Set(model.thinkingEfforts ?? [])];
    if (efforts.some(value => typeof value !== 'string' || !value.trim())) throw new TypeError('Thinking efforts must be nonempty strings.');
    return { ...model, label: model.label || model.id, thinkingEfforts: efforts };
  });
}

// Reusable lifecycle. Identity verification and transport belong to the adapter.
class AgentController {
  constructor({ definition, adapter, now = Date.now }) {
    for (const method of ['getSession', 'signIn', 'signOut', 'run']) {
      if (typeof adapter?.[method] !== 'function') throw new TypeError(`Adapter needs ${method}().`);
    }
    this.adapter = adapter; this.now = now; this.listeners = new Set();
    this.authEpoch = 0; this.runEpoch = 0; this.checkEpoch = 0; this.alive = true;
    this.modelsAccountId = null; this.contextKey = null;
    this.state = { definition: defineAgent(definition), session: null, models: [], model: '', thinkingEffort: '',
      busy: 'checking', result: null, output: null, status: { tone: 'busy', message: 'Checking sign-in…' } };
  }
  subscribe(listener) { this.listeners.add(listener); listener(this.state); return () => this.listeners.delete(listener); }
  emit() { if (this.alive) for (const listener of this.listeners) listener(this.state); }
  status(tone, message) { this.state.status = { tone, message }; this.emit(); }
  get ready() {
    const s = this.state;
    return this.alive && !s.busy && Boolean(s.session) && (!s.definition.modelSelection ||
      (this.modelsAccountId === s.session.user.id && s.models.some(model => model.id === s.model)));
  }
  currentAuth(epoch) { return this.alive && epoch === this.authEpoch; }
  beginAuth(busy) {
    ++this.authEpoch; ++this.checkEpoch;
    this.authAbort?.abort(); this.authAbort = new AbortController();
    this.invalidateRun(); this.state.busy = busy;
    return this.authEpoch;
  }
  clearModels() { this.modelsAccountId = null; this.state.models = []; this.state.model = ''; this.state.thinkingEffort = ''; }
  adoptSession(session) {
    const changed = this.state.session?.user.id !== session?.user.id;
    if (changed) { this.invalidateRun(); this.clearModels(); }
    this.state.session = session; return changed;
  }
  signedOut(message = 'Your session expired. Sign in again to test.') {
    this.beginAuth(null); this.adoptSession(null); this.clearModels(); this.status('warning', message);
  }
  handleError(error, fallback) {
    if (isSessionExpired(error)) this.signedOut();
    else { this.state.busy = null; this.status('error', error?.message || fallback); }
  }
  async start() { await this.authenticate(false); }
  async signIn() {
    if (!this.alive || (this.state.busy && this.state.busy !== 'running')) return;
    await this.authenticate(true);
  }
  async authenticate(connect) {
    if (!this.alive) return;
    const epoch = this.beginAuth(connect ? 'signing-in' : 'checking'), { signal } = this.authAbort;
    this.status('busy', connect ? 'Completing sign-in…' : 'Checking sign-in…');
    try {
      if (connect) await this.adapter.signIn({ signal });
      if (!this.currentAuth(epoch)) return;
      const session = verifiedSession(await this.adapter.getSession({ signal }), this.now());
      if (!this.currentAuth(epoch)) return;
      this.adoptSession(session);
      if (!session) {
        this.state.busy = null;
        this.status(connect ? 'warning' : 'neutral', connect ? 'Sign-in was not completed. Try again.' : 'Sign in to test your agent.'); return;
      }
      await this.loadModels(signal, epoch);
      if (!this.currentAuth(epoch)) return;
      this.state.busy = null;
      const hasModels = !this.state.definition.modelSelection || this.state.models.length > 0;
      this.status(hasModels ? 'success' : 'warning', hasModels ? `Signed in as ${session.user.name}. Ready to test.`
        : 'Signed in, but no models are available. Use Reload models in Settings.');
    } catch (error) { if (this.currentAuth(epoch)) this.handleError(error, 'Sign-in could not be checked. Try again.'); }
  }
  async loadModels(signal, epoch) {
    const accountId = this.state.session?.user.id;
    if (!this.state.definition.modelSelection) { this.modelsAccountId = accountId; return; }
    if (typeof this.adapter.getModels !== 'function') throw new TypeError('Adapter needs getModels().');
    const models = normalizeModels(await this.adapter.getModels({ signal, accountId }));
    if (signal?.aborted || !this.currentAuth(epoch) || this.state.session?.user.id !== accountId) return;
    this.state.models = models; this.modelsAccountId = accountId;
    this.state.model = models.some(model => model.id === this.state.model) ? this.state.model : models[0]?.id || '';
    this.chooseEffort();
  }
  async reloadModels() {
    if (!this.alive || !this.state.session || this.state.busy) return;
    const epoch = this.beginAuth('models'), { signal } = this.authAbort;
    this.status('busy', 'Loading available models…');
    try {
      const session = verifiedSession(await this.adapter.getSession({ signal }), this.now());
      if (!this.currentAuth(epoch)) return;
      if (!session) { this.signedOut(); return; }
      const changed = this.adoptSession(session);
      await this.loadModels(signal, epoch);
      if (!this.currentAuth(epoch)) return;
      this.state.busy = null;
      this.status(changed || !this.state.models.length ? 'warning' : 'success', changed
        ? 'Account changed. Review the new model settings and choose Go again.'
        : this.state.models.length ? 'Models updated. Ready to test.' : 'No models are available for this account.');
    } catch (error) { if (this.currentAuth(epoch)) this.handleError(error, 'Could not load models.'); }
  }
  async switchAccount(session) {
    const epoch = this.beginAuth('models'), { signal } = this.authAbort;
    this.adoptSession(session); this.status('busy', 'Account changed. Loading this account’s models…');
    try {
      await this.loadModels(signal, epoch);
      if (!this.currentAuth(epoch)) return;
      this.state.busy = null; this.status('warning', 'Account changed. Review the new model settings and choose Go again.');
    } catch (error) { if (this.currentAuth(epoch)) this.handleError(error, 'Could not load this account’s models.'); }
  }
  async refreshSession() {
    if (!this.alive || (this.state.busy && this.state.busy !== 'running')) return;
    const auth = this.authEpoch, check = ++this.checkEpoch;
    try {
      const session = verifiedSession(await this.adapter.getSession({}), this.now());
      if (!this.currentAuth(auth) || check !== this.checkEpoch) return;
      if (!session) { if (this.state.session) this.signedOut(); return; }
      if (session.user.id !== this.state.session?.user.id) { await this.switchAccount(session); return; }
      this.state.session = session; this.emit();
    } catch (error) {
      if (!this.currentAuth(auth) || check !== this.checkEpoch) return;
      if (isSessionExpired(error)) this.signedOut();
      else if (!this.state.busy) this.status('error', error?.message || 'Could not check the session.');
    }
  }
  chooseEffort() {
    const model = this.state.models.find(model => model.id === this.state.model), efforts = model?.thinkingEfforts || [];
    this.state.thinkingEffort = efforts.includes(this.state.thinkingEffort) ? this.state.thinkingEffort
      : efforts.includes(model?.defaultThinkingEffort) ? model.defaultThinkingEffort : efforts[0] || '';
  }
  setModel(id) {
    if (!this.state.models.some(model => model.id === id) || this.state.model === id) return;
    this.state.model = id; this.chooseEffort(); this.changed('Model changed.');
  }
  setEffort(value) {
    const model = this.state.models.find(model => model.id === this.state.model);
    if (!model?.thinkingEfforts.includes(value) || value === this.state.thinkingEffort) return;
    this.state.thinkingEffort = value; this.changed('Thinking effort changed.');
  }
  setValue(field, value) {
    if (!['prompt', 'input'].includes(field) || !this.state.definition[field].editable || this.state.definition[field].value === value) return;
    this.state.definition = defineAgent({ ...this.state.definition, [field]: { ...this.state.definition[field], value } });
    this.changed(`${this.state.definition[field].label} changed.`);
  }
  setContext(key) {
    if (this.contextKey === key) return;
    this.contextKey = key;
    if (this.state.result !== null || this.state.busy === 'running') this.changed('Agent context changed.');
    else { this.invalidateRun(); this.emit(); }
  }
  configure({ title, promptMode, inputMode }) {
    if (this.state.busy && this.state.busy !== 'running') return false;
    const modes = { editable: { editable: true, visible: true }, fixed: { editable: false, visible: true }, hidden: { editable: false, visible: false } };
    if (!title?.trim() || !Object.hasOwn(modes, promptMode) || !Object.hasOwn(modes, inputMode)) {
      this.status('error', 'Enter a template name and choose valid field modes.'); return false;
    }
    for (const [key, fieldMode] of [['prompt', promptMode], ['input', inputMode]]) {
      if (fieldMode !== 'editable' && this.state.definition[key].required && !this.state.definition[key].value.trim()) {
        this.status('warning', `Add ${this.state.definition[key].label.toLowerCase()} before making it fixed or hidden.`); return false;
      }
    }
    this.state.definition = defineAgent({ ...this.state.definition, title: title.trim(),
      prompt: { ...this.state.definition.prompt, ...modes[promptMode] }, input: { ...this.state.definition.input, ...modes[inputMode] } });
    this.changed('Template updated for this session.'); return true;
  }
  changed(message) {
    const stale = this.state.result !== null || this.state.busy === 'running';
    this.invalidateRun();
    if (stale) this.status('warning', `${message} Run again for a current result.`);
    else if (!this.state.busy) this.status('neutral', this.state.session ? message : `${message} Sign in to test.`);
    else this.emit();
  }
  invalidateRun() {
    ++this.runEpoch; this.runAbort?.abort(); this.runAbort = null;
    this.state.result = null; this.state.output = null;
    if (this.state.busy === 'running') this.state.busy = null;
  }
  cancel() {
    if (this.state.busy !== 'running') return;
    this.invalidateRun(); this.status('warning', 'Test canceled. Ready to try again.');
  }
  async run() {
    if (!this.ready) {
      if (!this.state.busy) this.status('warning', this.state.session ? 'Choose an available model first.' : 'Sign in before running a test.'); return;
    }
    for (const field of ['prompt', 'input']) {
      if (this.state.definition[field].required && !this.state.definition[field].value.trim()) {
        this.status('warning', `Add ${this.state.definition[field].label.toLowerCase()} before running a test.`); return;
      }
    }
    this.invalidateRun();
    const epoch = this.runEpoch, auth = this.authEpoch, abort = this.runAbort = new AbortController();
    const current = () => this.currentAuth(auth) && epoch === this.runEpoch && !abort.signal.aborted;
    const accountId = this.state.session.user.id;
    this.state.busy = 'running'; this.status('busy', 'Running your test…');
    try {
      const session = verifiedSession(await this.adapter.getSession({ signal: abort.signal }), this.now());
      if (!current()) return;
      if (!session) { this.signedOut(); return; }
      if (session.user.id !== accountId) { await this.switchAccount(session); return; }
      this.state.session = session;
      // Construct only after account verification; edits invalidate this operation.
      const d = this.state.definition;
      const request = { agentId: d.id, prompt: d.prompt.value, input: d.input.value, accountId, contextKey: this.contextKey, signal: abort.signal };
      if (d.modelSelection) {
        if (this.modelsAccountId !== accountId) { await this.switchAccount(session); return; }
        const model = this.state.models.find(row => row.id === this.state.model);
        if (!model) throw new Error('Choose an available model first.');
        request.model = model.id;
        if (model.thinkingEfforts.includes(this.state.thinkingEffort)) request.thinkingEffort = this.state.thinkingEffort;
      }
      const output = await this.adapter.run(request);
      if (!current()) return;
      this.state.result = formatResult(output); this.state.output = output; this.state.busy = null;
      this.status('success', 'Test complete. Your result is ready.');
    } catch (error) { if (current()) this.handleError(error, 'The test failed. Try again.'); }
  }
  async signOut() {
    if (!this.alive || !this.state.session || (this.state.busy && this.state.busy !== 'running')) return;
    const epoch = this.beginAuth('signing-out'), { signal } = this.authAbort;
    this.status('busy', 'Signing out…');
    try {
      await this.adapter.signOut({ signal });
      if (!this.currentAuth(epoch)) return;
      const session = verifiedSession(await this.adapter.getSession({ signal }), this.now());
      if (!this.currentAuth(epoch)) return;
      const changed = this.adoptSession(session);
      if (session && changed) { await this.switchAccount(session); return; }
      this.state.busy = null;
      this.status(session ? 'error' : 'neutral', session ? 'Sign-out was not completed. Try again.' : 'Signed out. Sign in to test your agent.');
    } catch (error) { if (this.currentAuth(epoch)) this.handleError(error, 'Could not sign out. Try again.'); }
  }
  destroy() { this.alive = false; ++this.authEpoch; ++this.checkEpoch; this.invalidateRun(); this.authAbort?.abort(); this.listeners.clear(); }
}


let nextId = 0;
function mountAgent(root, { definition, adapter, navigation, connection, clipboard = globalThis.navigator?.clipboard }) {
  const controller = new AgentController({ definition, adapter });
  const uid = `ai-agent-${++nextId}`, doc = root.ownerDocument, events = new AbortController();
  const on = (node, event, handler) => node.addEventListener(event, handler, { signal: events.signal });
  root.classList.add('ai-agent');
  // Static markup only. User/provider content is always assigned as literal text.
  root.innerHTML = `
    <header class="agent-topbar">
      <div class="agent-account"><button type="button" data-el="signin">Sign in with ChatGPT</button><span data-el="account" hidden></span><button type="button" data-el="signout" hidden>Sign out</button></div>
      <div class="agent-selectors" data-el="selectors"><label for="${uid}-model">Model<select id="${uid}-model" data-el="model" disabled></select></label><label for="${uid}-effort">Thinking effort<select id="${uid}-effort" data-el="effort" disabled></select></label></div>
    </header>
    <div class="agent-navigation-group"><nav class="agent-navigation" data-el="navigation" aria-label="Agent navigation">
      <div class="browser-buttons"><button type="button" data-el="previous" disabled>Previous tab</button><button type="button" data-el="next" disabled>Next tab</button></div>
      <div class="agent-tabs" role="tablist" aria-label="Agent workspace"><button type="button" id="${uid}-agent-tab" role="tab" aria-selected="true" aria-controls="${uid}-workspace" data-tab="workspace">Agent</button><button type="button" id="${uid}-settings-tab" role="tab" aria-selected="false" aria-controls="${uid}-settings" tabindex="-1" data-tab="settings">Settings</button></div>
    </nav><div class="agent-status" data-el="status" data-tone="busy" role="status" aria-live="polite" aria-atomic="true"><span class="status-light" aria-hidden="true"></span><span data-el="status-message"></span></div></div>
    <section id="${uid}-workspace" role="tabpanel" aria-labelledby="${uid}-agent-tab" data-panel="workspace" class="agent-workspace">
      <h1 data-el="title"></h1>
      <section class="agent-panel" data-el="prompt-panel"><label for="${uid}-prompt" data-el="prompt-label"></label><textarea id="${uid}-prompt" data-el="prompt" spellcheck="false" rows="6"></textarea></section>
      <section class="agent-panel" data-el="input-panel"><label for="${uid}-input" data-el="input-label"></label><textarea id="${uid}-input" data-el="input" spellcheck="false" rows="6"></textarea></section>
      <div class="agent-runbar"><span class="keyboard-hint">Ctrl / ⌘ + Enter to run</span><div><button type="button" data-el="cancel" hidden>Cancel</button><button type="button" class="primary" data-el="go">Go</button></div></div>
      <section class="agent-panel result-panel" aria-labelledby="${uid}-result-label"><div class="result-heading"><h2 id="${uid}-result-label" data-el="result-label"></h2><button type="button" data-el="copy" disabled>Copy</button></div><p class="result-placeholder" data-el="result-empty"></p><div data-el="custom-result" hidden></div><pre data-el="result" tabindex="0" hidden></pre></section>
    </section>
    <section id="${uid}-settings" role="tabpanel" aria-labelledby="${uid}-settings-tab" data-panel="settings" class="agent-settings" hidden>
      <h2>Settings</h2><form data-el="connection-form" novalidate><label for="${uid}-url">Hosted agent HTTPS origin</label><div class="connection-row"><input type="url" id="${uid}-url" data-el="url" placeholder="https://your-agent.example" autocomplete="off" required><button type="submit" data-el="save">Save</button></div></form>
      <button type="button" data-el="reload-models">Reload models</button>
    </section>`;
  const el = Object.fromEntries([...root.querySelectorAll('[data-el]')].map(node => [node.dataset.el, node]));
  const tabs = [...root.querySelectorAll('[data-tab]')], panels = [...root.querySelectorAll('[data-panel]')];
  const options = (select, values, selected, empty) => {
    const items = values.length ? values : [{ value: '', label: empty }], signature = JSON.stringify(items);
    if (select.dataset.options !== signature) {
      select.replaceChildren(...items.map(item => { const option = doc.createElement('option'); option.value = item.value; option.textContent = item.label; return option; }));
      select.dataset.options = signature;
    }
    select.value = selected;
  };
  function selectTab(name) {
    for (const tab of tabs) { const active = tab.dataset.tab === name; tab.setAttribute('aria-selected', String(active)); tab.tabIndex = active ? 0 : -1; }
    for (const panel of panels) panel.hidden = panel.dataset.panel !== name;
  }
  for (const tab of tabs) {
    on(tab, 'click', () => selectTab(tab.dataset.tab));
    on(tab, 'keydown', event => {
      const index = tabs.indexOf(tab), target = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1
        : event.key === 'ArrowRight' ? (index + 1) % tabs.length : event.key === 'ArrowLeft' ? (index + tabs.length - 1) % tabs.length : -1;
      if (target >= 0) { event.preventDefault(); selectTab(tabs[target].dataset.tab); tabs[target].focus(); }
    });
  }
  let lastOutput, navigationEpoch = 0;
  controller.subscribe(state => {
    const d = state.definition, account = state.session?.user, authBusy = Boolean(state.busy && state.busy !== 'running');
    el.signin.hidden = Boolean(account); el.signin.disabled = authBusy;
    el.signin.textContent = d.preview ? 'Preview sign in' : `Sign in with ${d.provider}`;
    el.account.hidden = !account; el.account.textContent = account ? `${account.name} · ${account.id.slice(-8)}` : '';
    el.signout.hidden = !account; el.signout.disabled = authBusy; el.selectors.hidden = !d.modelSelection;
    options(el.model, state.models.map(model => ({ value: model.id, label: model.label })), state.model, account ? 'No models available' : 'Sign in to select');
    const model = state.models.find(model => model.id === state.model);
    options(el.effort, (model?.thinkingEfforts || []).map(value => ({ value, label: value })), state.thinkingEffort, 'Not available');
    el.model.disabled = authBusy || !state.models.length; el.effort.disabled = authBusy || !model?.thinkingEfforts.length;
    el.status.dataset.tone = state.status.tone;
    el['status-message'].textContent = `${d.preview ? 'Preview only · ' : ''}${state.status.message}${d.preview ? ' No live connection.' : ''}`;
    el.title.textContent = d.title;
    for (const field of ['prompt', 'input']) {
      el[`${field}-panel`].hidden = !d[field].visible; el[`${field}-label`].textContent = d[field].label;
      el[field].readOnly = !d[field].editable; el[field].placeholder = d[field].placeholder || '';
      if (el[field].value !== d[field].value) el[field].value = d[field].value;
    }
    el['result-label'].textContent = d.result.label; el['result-empty'].textContent = d.result.placeholder;
    el['result-empty'].hidden = state.result !== null; el.result.hidden = state.result === null; el.result.textContent = state.result ?? '';
    el['custom-result'].hidden = state.output === null || typeof d.result.render !== 'function';
    if (lastOutput !== state.output) { lastOutput = state.output; el['custom-result'].replaceChildren(); if (state.output && typeof d.result.render === 'function') d.result.render(el['custom-result'], state.output); }
    el.copy.disabled = state.result === null || Boolean(state.busy); el.go.disabled = !controller.ready; el.cancel.hidden = state.busy !== 'running';
    el['reload-models'].hidden = !d.modelSelection; el['reload-models'].disabled = !account || Boolean(state.busy);
    root.querySelector('.result-panel').setAttribute('aria-busy', String(state.busy === 'running'));
  });
  el['connection-form'].hidden = !connection;
  on(el['connection-form'], 'submit', async event => {
    event.preventDefault(); if (!connection) return; el.save.disabled = true;
    try { await connection.save(el.url.value, controller); }
    catch (error) { controller.status('error', error?.message || 'Could not configure the hosted agent.'); }
    finally { if (controller.alive) el.save.disabled = false; }
  });
  on(el.signin, 'click', () => controller.signIn()); on(el.signout, 'click', () => controller.signOut());
  on(el.model, 'change', () => controller.setModel(el.model.value)); on(el.effort, 'change', () => controller.setEffort(el.effort.value));
  for (const field of ['prompt', 'input']) on(el[field], 'input', () => controller.setValue(field, el[field].value));
  on(el.go, 'click', () => controller.run()); on(el.cancel, 'click', () => controller.cancel()); on(el['reload-models'], 'click', () => controller.reloadModels());
  on(root, 'keydown', event => { if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && !panels[0].hidden) { event.preventDefault(); if (controller.ready) controller.run(); } });
  on(el.copy, 'click', async () => {
    const epoch = controller.runEpoch;
    try { if (!clipboard?.writeText) throw new Error('Copy is unavailable. Select the output text to copy it.'); await clipboard.writeText(controller.state.result); if (controller.alive && epoch === controller.runEpoch) controller.status('success', 'Output copied.'); }
    catch { if (controller.alive && epoch === controller.runEpoch) controller.status('error', 'Could not copy. Select the output text to copy it.'); }
  });
  async function refreshNavigation() {
    const epoch = ++navigationEpoch;
    try { const state = await navigation?.status(); if (!controller.alive || epoch !== navigationEpoch) return; el.previous.disabled = el.next.disabled = !state?.available || state.count < 2; }
    catch { if (controller.alive && epoch === navigationEpoch) el.previous.disabled = el.next.disabled = true; }
  }
  for (const [name, direction] of [['previous', -1], ['next', 1]]) on(el[name], 'click', async () => {
    const auth = controller.authEpoch, run = controller.runEpoch;
    try { const result = await navigation.move(direction); if (controller.alive && auth === controller.authEpoch && run === controller.runEpoch) controller.status(controller.state.busy ? 'busy' : 'neutral', result.message); }
    catch (error) { if (controller.alive && auth === controller.authEpoch && run === controller.runEpoch) controller.status('error', error?.message || 'The browser tab could not be selected.'); }
    await refreshNavigation();
  });
  const ready = controller.start(); void refreshNavigation();
  return { controller, ready, refreshNavigation, setConnectionUrl(value) { if (doc.activeElement !== el.url) el.url.value = value; },
    destroy() { ++navigationEpoch; events.abort(); controller.destroy(); root.replaceChildren(); root.classList.remove('ai-agent'); } };
}

function delay(ms, signal) {
  return new Promise((resolve, reject) => {
    const abort = () => { clearTimeout(timer); reject(new DOMException('Canceled', 'AbortError')); };
    const timer = setTimeout(() => { signal?.removeEventListener('abort', abort); resolve(); }, ms);
    if (signal?.aborted) abort();
    else signal?.addEventListener('abort', abort, { once: true });
  });
}

// UI fixture only. No network calls, credentials, live models, or AI inference.
function createPreviewAdapter({ latency = 650 } = {}) {
  let signedIn = false;
  return {
    async getSession() {
      return signedIn ? { authenticated: true, user: { id: 'preview', name: 'Preview account' } } : null;
    },
    async signIn({ signal } = {}) { await delay(220, signal); signedIn = true; },
    async signOut() { signedIn = false; },
    async getModels() {
      return [
        { id: 'sample-reasoning', label: 'Sample reasoning model', thinkingEfforts: ['low', 'medium', 'high'], defaultThinkingEffort: 'medium' },
        { id: 'sample-standard', label: 'Sample standard model', thinkingEfforts: [] },
      ];
    },
    async run({ prompt, input, model, thinkingEffort, signal }) {
      await delay(latency, signal);
      return { text: [
        'SAMPLE RESULT · UI PREVIEW', '',
        'This is a local sample response. No information was sent to ChatGPT or an API.', '',
        'Prompt template:', prompt, '', 'Test input:', input,
        ...(model ? ['', `Selected model: ${model}`, ...(thinkingEffort ? [`Thinking effort: ${thinkingEffort}`] : [])] : []),
      ].join('\n') };
    },
  };
}


const chatgptTemplate = defineAgent({ id: 'chatgpt-template', title: 'AI agent template' });

const fixedPromptAgent = defineAgent({
  id: 'fixed-prompt', title: 'Text summary',
  prompt: { value: 'Summarize the supplied text using only the information it contains.', editable: false },
  input: { label: 'Text to summarize' },
});

const fixedInputAgent = defineAgent({
  id: 'fixed-input', title: 'Fixed input example',
  input: { value: 'Sample text for a UI demonstration.', editable: false, visible: false },
});

// An authenticated API may return { data } directly. No AI model selector is needed.
const apiResultAgent = defineAgent({
  id: 'api-result', title: 'API lookup', provider: 'your service', modelSelection: false,
  prompt: { value: '', editable: false, visible: false, required: false },
  input: { label: 'Lookup input', placeholder: 'Enter the value to look up…' },
});


mountAgent(document.querySelector('#agent'), {
  definition: { ...chatgptTemplate, preview: true, input: { ...chatgptTemplate.input,
    value: 'Explain how rain forms in three short points.' } },
  adapter: createPreviewAdapter(),
});
