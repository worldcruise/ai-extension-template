<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0e1a2f"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Energy Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00F59B"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Infinity Glass Gradient -->
    <linearGradient id="infGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F59B" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00F59B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="12" filter="url(#neonGlow)"/>

  <!-- Radial Core Energy Aura -->
  <circle cx="256" cy="256" r="140" fill="#00F59B" opacity="0.12" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="80" fill="#00E5FF" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- Turbo Fast-Forward Chevrons (Top Right) -->
  <g fill="none" stroke="#00F59B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 330 150 L 360 120 L 390 150" />
    <path d="M 350 180 L 380 150 L 410 180" />
  </g>

  <!-- Turbo Fast-Forward Chevrons (Bottom Left) -->
  <g fill="none" stroke="#00E5FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 122 362 L 152 332 L 182 362" />
    <path d="M 102 392 L 132 362 L 162 392" />
  </g>

  <!-- Stylized Lightning Bolt (Behind Infinity) -->
  <path d="M 285 85 L 205 245 L 270 245 L 225 425 L 335 235 L 265 235 Z" 
        fill="url(#boltGrad)" 
        filter="url(#neonGlow)" 
        opacity="0.92"/>

  <!-- Glowing Infinity Loop -->
  <path d="M 180,256 C 180,210 110,210 110,256 C 110,302 180,302 256,256 C 332,210 402,210 402,256 C 402,302 332,302 256,256 C 180,210 110,210 110,256"
        fill="none" 
        stroke="url(#infGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Infinity Highlight for 3D Glass Effect -->
  <path d="M 180,256 C 180,210 110,210 110,256 C 110,302 180,302 256,256 C 332,210 402,210 402,256 C 402,302 332,302 256,256 C 180,210 110,210 110,256"
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.75"/>

  <!-- Core Spark Star -->
  <polygon points="256,236 262,250 276,256 262,262 256,276 250,262 236,256 250,250" fill="#FFFFFF" filter="url(#neonGlow)"/>
</svg>
