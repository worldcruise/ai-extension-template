<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ChatGPT Sidebar</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden !important;
        }
        #chatgpt-iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden !important;
        }
    </style>
</head>
<body>
    <iframe 
        id="chatgpt-iframe" 
        src="https://chat.openai.com"
        allow="clipboard-read; clipboard-write"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals">
    </iframe>
</body>
</html>
